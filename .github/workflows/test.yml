name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Korean fonts make the sample render realistic. The runner mirror is sometimes slow, so cap it and continue without fonts instead of hanging.
      - run: (sudo timeout 240 apt-get update -qq && sudo timeout 300 apt-get install -y -qq fonts-noto-cjk) || echo "font install skipped"
      - run: node tests/run.mjs
        env:
          PYTHON: python
